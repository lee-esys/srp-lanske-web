name: Team l10n migration

on:
  push:
    branches:
      - refactor/105-migrate-team-l10n-to-arb
    paths:
      - tools/migrate_team_l10n.py
      - .github/workflows/team-l10n-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Migrate team localizations
        run: python tools/migrate_team_l10n.py

      - name: Remove migration helpers
        run: |
          rm tools/migrate_team_l10n.py
          rm .github/workflows/team-l10n-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🧹 migrate team l10n to ARB refs #105"
          git push origin HEAD:refactor/105-migrate-team-l10n-to-arb
