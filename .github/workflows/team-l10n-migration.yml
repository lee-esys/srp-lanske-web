name: Team l10n migration

on:
  push:
    branches:
      - refactor/105-migrate-team-l10n-to-arb

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Migrate team localizations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/migrate_team_l10n.py')
          text = path.read_text(encoding='utf-8')
          old = "'bocciaScoreSummary':['redTeamName','redScore','blueTeamName','blueScore']"
          new = "'bocciaScoreSummary':['redTeamName','redScore','blueScore','blueTeamName']"
          if old not in text:
              raise SystemExit('bocciaScoreSummary argument order patch target was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/migrate_team_l10n.py

      - name: Remove migration helpers
        run: |
          rm tools/migrate_team_l10n.py
          rm .github/workflows/team-l10n-migration.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🧹 migrate team l10n to ARB refs #105"
          git push origin HEAD:refactor/105-migrate-team-l10n-to-arb
